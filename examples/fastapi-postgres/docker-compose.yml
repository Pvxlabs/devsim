services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: devsim_example
      POSTGRES_USER: devsim
      POSTGRES_PASSWORD: devsim
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devsim -d devsim_example"]
      interval: 2s
      timeout: 3s
      retries: 20
  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://devsim:devsim@postgres:5432/devsim_example
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
