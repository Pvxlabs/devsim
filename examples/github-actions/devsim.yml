name: DevSim validation

on:
  pull_request:
  push:

jobs:
  devsim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install devsim
      - run: devsim project validate --json
      - run: devsim scenario validate --all --json
      - run: devsim seed validate --profile normal --json
