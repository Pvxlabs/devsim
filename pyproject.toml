[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devsim"
version = "0.1.0"
description = "A deterministic preview runtime for stateful applications"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "DevSim contributors" }]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
devsim = "devsim.cli:main"

[tool.setuptools.packages.find]
include = ["devsim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
