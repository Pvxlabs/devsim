[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devsim"
version = "0.2.0"
description = "A deterministic preview runtime for stateful applications"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "DevSim contributors" }]
dependencies = ["PyYAML>=6.0", "websockets>=12.0"]

[project.optional-dependencies]
test = ["pytest>=8.0"]
postgres = ["psycopg[binary]>=3.2"]
browser = ["playwright>=1.40"]

[project.scripts]
devsim = "devsim.cli:main"

[tool.setuptools.packages.find]
include = ["devsim*"]

[tool.setuptools.data-files]
"share/devsim/skills/devsim" = ["skills/devsim/SKILL.md"]
"share/devsim/skills/devsim/agents" = ["skills/devsim/agents/openai.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
